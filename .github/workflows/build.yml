name: Build

on:
  # Branch pushes build through their pull request; main builds on its own.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared logic tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Build TV test app (debug APK)
        run: ./gradlew :tv:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marquee-player-test-${{ github.sha }}
          path: tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
